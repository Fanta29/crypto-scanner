<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icône d'application : le médaillon du bandeau (voir LOGO dans ui.js),
       à l'échelle 512. Fond plein et pleine page, sans transparence ni coins
       arrondis : iOS et Android appliquent leur propre masque, et Safari rend
       mal les icônes transparentes sur fond clair. Le médaillon tient dans la
       zone sûre des icônes « maskable » (rayon 205 sur 512). -->
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset=".55" stop-color="#4ADE9B"/>
      <stop offset="1" stop-color="#F5B84A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0B0D11"/>
  <circle cx="256" cy="256" r="176" fill="#161A21" stroke="#232935" stroke-width="12"/>
  <path d="M256 139 L367 350 L145 350 Z" fill="url(#logoGrad)"/>
</svg>
